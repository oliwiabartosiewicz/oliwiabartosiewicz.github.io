<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1600" height="1000" fill="#0b1118"/>
<rect x="0" y="0" width="1600" height="64" fill="#151e29"/>
<circle cx="40" cy="32" r="10" fill="#ef6b5e"/><circle cx="72" cy="32" r="10" fill="#f2b33d"/><circle cx="104" cy="32" r="10" fill="#4cc38a"/>
<text x="140" y="41" font-family="Menlo, Consolas, monospace" font-size="24" fill="#7c8a9b">ACalculator — dotnet run</text>
<text x="64" y="128" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" xml:space="preserve" fill="#f2b33d">------CALCULATOR------</text>
<text x="64" y="173" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" xml:space="preserve" fill="#dbe4ef">1. Addition        9. Averages</text>
<text x="64" y="218" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" xml:space="preserve" fill="#dbe4ef">2. Subtraction    10. Largest and Smallest</text>
<text x="64" y="263" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" xml:space="preserve" fill="#dbe4ef">3. Multiplication 11. Factorial</text>
<text x="64" y="308" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" xml:space="preserve" fill="#dbe4ef">4. Division       12. Trigonometry</text>
<text x="64" y="353" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" xml:space="preserve" fill="#dbe4ef">5. Modulus        13. Rounding</text>
<text x="64" y="398" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" xml:space="preserve" fill="#dbe4ef">6. Powers         14. View History</text>
<text x="64" y="443" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" xml:space="preserve" fill="#dbe4ef">7. Square Root    15. Clear History</text>
<text x="64" y="488" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" xml:space="preserve" fill="#dbe4ef">8. Percentages    16. Exit</text>
<text x="64" y="533" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" xml:space="preserve" fill="#dbe4ef"></text>
<text x="64" y="578" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" xml:space="preserve" fill="#7fb4ff">Enter your choice: 12</text>
<text x="64" y="623" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" xml:space="preserve" fill="#dbe4ef">1. Sine  2. Cosine  3. Tangent</text>
<text x="64" y="668" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" xml:space="preserve" fill="#7fb4ff">Enter your choice: 3</text>
<text x="64" y="713" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" xml:space="preserve" fill="#7fb4ff">Enter angle in degrees: 90</text>
<text x="64" y="758" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" xml:space="preserve" fill="#ef6b5e">Error: Tangent is undefined at this angle.</text>
<text x="64" y="803" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" xml:space="preserve" fill="#dbe4ef"></text>
<text x="64" y="848" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" xml:space="preserve" fill="#7fb4ff">Enter your choice: 6</text>
<text x="64" y="893" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" xml:space="preserve" fill="#7fb4ff">Enter a number: 2   Enter exponent: 10</text>
<text x="64" y="938" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" xml:space="preserve" fill="#4cc38a"> RESULT: 2^10 = 1024</text>
</svg>